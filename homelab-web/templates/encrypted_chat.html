<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; padding: 2rem; }
        .container { max-width: 800px; width: 100%; }
        .back { display: inline-block; color: #7b2fbe; text-decoration: none; margin-bottom: 1rem; }
        .back:hover { text-decoration: underline; }
        h1 { font-size: 2rem; margin-bottom: 0.25rem; }
        .sub { color: #888; margin-bottom: 2rem; }
        .card { background: #14141f; border: 1px solid #1f1f32; border-radius: 16px; padding: 2rem; }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn-group button { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.3s; flex: 1; min-width: 120px; }
        .btn-group button:hover { opacity: 0.8; }
        .btn-start { background: linear-gradient(135deg, #7b2fbe, #00d4ff); color: white; }
        .btn-stop { background: #3a1a1a; color: #ff6b6b; border: 1px solid #ff6b6b; }
        .status { padding: 0.5rem 1rem; border-radius: 8px; margin-top: 1rem; display: none; }
        .status.running { display: block; background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; }
        .status.stopped { display: block; background: #1a1a1a; border: 1px solid #666; color: #888; }
        #output { background: #0a0a0f; border: 1px solid #1f1f32; border-radius: 8px; padding: 1rem; margin-top: 1rem; white-space: pre-wrap; font-family: monospace; max-height: 400px; overflow-y: auto; display: none; }
        #output.show { display: block; }
        .loading { display: none; color: #888; margin-top: 1rem; }
        .loading.show { display: block; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Dashboard</a>
        <h1>💬 Encrypted Chat</h1>
        <p class="sub">Chat securizat cu criptare AES (Fernet)</p>
        <div class="card">
            <p style="color:#888;margin-bottom:1rem;">Serverul rulează pe portul 5001 cu parola <code>chat123</code></p>
            <div class="btn-group">
                <button class="btn-start" onclick="runChat('start_server')">▶ Pornește Server</button>
                <button class="btn-stop" onclick="runChat('stop_server')">⏹ Oprește Server</button>
            </div>
            <div class="status" id="status"></div>
            <div class="loading" id="loading">⏳ Procesare...</div>
            <pre id="output"></pre>
        </div>
        <div style="margin-top:1rem;padding:1rem;background:#14141f;border-radius:8px;border:1px solid #1f1f32;">
            <p style="color:#888;font-size:0.9rem;">
                <strong>Conectare client:</strong><br>
                <code style="color:#4caf50;">python client.py -s 192.168.1.141 -p 5001 -u PhoneUser --password chat123</code>
            </p>
        </div>
    </div>
    <script>
        async function runChat(action) {
            const output = document.getElementById('output');
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            output.classList.remove('show');
            loading.classList.add('show');
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });
                const data = await response.json();
                if (data.success) {
                    status.textContent = data.message;
                    status.className = 'status ' + (action === 'start_server' ? 'running' : 'stopped');
                } else {
                    output.textContent = data.error || 'Eroare.';
                    output.classList.add('show', 'error');
                }
            } catch (err) {
                output.textContent = 'Eroare: ' + err.message;
                output.classList.add('show', 'error');
            } finally {
                loading.classList.remove('show');
            }
        }
    </script>
</body>
</html>
