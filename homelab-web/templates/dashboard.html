<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem;
        }
        .container { max-width: 1200px; width: 100%; }
        header {
            text-align: center;
            padding: 2rem 0;
            border-bottom: 1px solid #1a1a2e;
            margin-bottom: 2rem;
        }
        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2fbe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p { color: #888; margin-top: 0.5rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: #14141f;
            border: 1px solid #1f1f32;
            border-radius: 16px;
            padding: 1.5rem;
            text-decoration: none;
            color: #e0e0e0;
            transition: all 0.3s ease;
            display: block;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #7b2fbe;
            box-shadow: 0 8px 30px rgba(123, 47, 190, 0.15);
        }
        .card .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .card h3 { font-size: 1.1rem; margin-bottom: 0.25rem; }
        .card p { font-size: 0.85rem; color: #888; }
        .badge {
            display: inline-block;
            background: #1a1a2e;
            color: #666;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            margin-top: 0.5rem;
        }
        .footer {
            text-align: center;
            color: #444;
            font-size: 0.8rem;
            padding: 2rem 0;
            margin-top: 2rem;
            border-top: 1px solid #1a1a2e;
        }
        @media (max-width: 600px) {
            body { padding: 1rem; }
            header h1 { font-size: 1.8rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 Homelab Dashboard</h1>
            <p>Cybersecurity Tools — 10 proiecte într-un singur loc</p>
        </header>
        <div class="grid">
            {% for tool in tools %}
            <a href="{{ tool.route }}" class="card">
                <div class="icon">{{ tool.icon }}</div>
                <h3>{{ tool.name }}</h3>
                <p>{{ tool.desc }}</p>
                <span class="badge">→ Open</span>
            </a>
            {% endfor %}
        </div>
        <div class="footer">
            Robert Mircea · Homelab 2026 · 🔐 Cybersecurity Portfolio
        </div>
    </div>
</body>
</html>
