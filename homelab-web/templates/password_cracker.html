<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Cracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; padding: 2rem; }
        .container { max-width: 800px; width: 100%; }
        .back { display: inline-block; color: #7b2fbe; text-decoration: none; margin-bottom: 1rem; }
        .back:hover { text-decoration: underline; }
        h1 { font-size: 2rem; margin-bottom: 0.25rem; }
        .sub { color: #888; margin-bottom: 2rem; }
        .card { background: #14141f; border: 1px solid #1f1f32; border-radius: 16px; padding: 2rem; }
        label { display: block; font-weight: 600; margin: 1rem 0 0.25rem; }
        input, select { width: 100%; padding: 0.75rem; background: #0a0a0f; border: 1px solid #1f1f32; border-radius: 8px; color: #e0e0e0; font-size: 1rem; }
        input:focus, select:focus { border-color: #7b2fbe; outline: none; }
        .row { display: flex; gap: 1rem; }
        .row > * { flex: 1; }
        button { background: linear-gradient(135deg, #7b2fbe, #00d4ff); border: none; color: white; padding: 0.75rem 2rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1.5rem; transition: opacity 0.3s; }
        button:hover { opacity: 0.8; }
        #output { background: #0a0a0f; border: 1px solid #1f1f32; border-radius: 8px; padding: 1rem; margin-top: 1rem; white-space: pre-wrap; font-family: monospace; max-height: 400px; overflow-y: auto; display: none; }
        #output.show { display: block; }
        .loading { display: none; color: #888; margin-top: 1rem; }
        .loading.show { display: block; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Dashboard</a>
        <h1>🔑 Password Cracker</h1>
        <p class="sub">Sparge hash-uri MD5, SHA1, SHA256, SHA512</p>
        <div class="card">
            <label for="hash">Hash țintă</label>
            <input type="text" id="hash" placeholder="5f4dcc3b5aa765d61d8327deb882cf99" value="5f4dcc3b5aa765d61d8327deb882cf99">
            <div class="row">
                <div>
                    <label for="algorithm">Algoritm</label>
                    <select id="algorithm">
                        <option value="md5">MD5</option>
                        <option value="sha1">SHA1</option>
                        <option value="sha256">SHA256</option>
                        <option value="sha512">SHA512</option>
                    </select>
                </div>
                <div>
                    <label for="method">Metodă</label>
                    <select id="method">
                        <option value="dictionary">Dicționar</option>
                        <option value="bruteforce">Brute Force</option>
                        <option value="hybrid">Hibrid</option>
                    </select>
                </div>
            </div>
            <label for="max_length">Lungime maximă (brute force)</label>
            <input type="number" id="max_length" value="4">
            <button onclick="runCrack()">▶ Start Cracking</button>
            <div class="loading" id="loading">⏳ Spargere în curs...</div>
            <pre id="output"></pre>
        </div>
    </div>
    <script>
        async function runCrack() {
            const hash = document.getElementById('hash').value.trim();
            const algorithm = document.getElementById('algorithm').value;
            const method = document.getElementById('method').value;
            const max_length = parseInt(document.getElementById('max_length').value) || 4;
            const output = document.getElementById('output');
            const loading = document.getElementById('loading');
            if (!hash) { alert('Te rog să introduci un hash.'); return; }
            output.classList.remove('show');
            loading.classList.add('show');
            try {
                const response = await fetch('/api/crack', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hash, algorithm, method, max_length })
                });
                const data = await response.json();
                output.textContent = data.output || data.error || 'Fără rezultate.';
                if (data.error) output.classList.add('error');
                output.classList.add('show');
            } catch (err) {
                output.textContent = 'Eroare: ' + err.message;
                output.classList.add('show', 'error');
            } finally {
                loading.classList.remove('show');
            }
        }
    </script>
</body>
</html>
