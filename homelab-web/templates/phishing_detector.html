<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; padding: 2rem; }
        .container { max-width: 800px; width: 100%; }
        .back { display: inline-block; color: #7b2fbe; text-decoration: none; margin-bottom: 1rem; }
        .back:hover { text-decoration: underline; }
        h1 { font-size: 2rem; margin-bottom: 0.25rem; }
        .sub { color: #888; margin-bottom: 2rem; }
        .card { background: #14141f; border: 1px solid #1f1f32; border-radius: 16px; padding: 2rem; }
        label { display: block; font-weight: 600; margin: 1rem 0 0.25rem; }
        input, textarea { width: 100%; padding: 0.75rem; background: #0a0a0f; border: 1px solid #1f1f32; border-radius: 8px; color: #e0e0e0; font-size: 1rem; font-family: inherit; }
        textarea { min-height: 100px; resize: vertical; }
        input:focus, textarea:focus { border-color: #7b2fbe; outline: none; }
        .row { display: flex; gap: 1rem; }
        .row > * { flex: 1; }
        button { background: linear-gradient(135deg, #7b2fbe, #00d4ff); border: none; color: white; padding: 0.75rem 2rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1.5rem; transition: opacity 0.3s; }
        button:hover { opacity: 0.8; }
        #output { background: #0a0a0f; border: 1px solid #1f1f32; border-radius: 8px; padding: 1rem; margin-top: 1rem; white-space: pre-wrap; font-family: monospace; max-height: 400px; overflow-y: auto; display: none; }
        #output.show { display: block; }
        .loading { display: none; color: #888; margin-top: 1rem; }
        .loading.show { display: block; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Dashboard</a>
        <h1>🎣 Phishing Detector</h1>
        <p class="sub">Analizează un email pentru tentative de phishing</p>
        <div class="card">
            <div class="row">
                <div>
                    <label for="from">From</label>
                    <input type="text" id="from" placeholder="expeditor@example.com">
                </div>
                <div>
                    <label for="reply_to">Reply-To</label>
                    <input type="text" id="reply_to" placeholder="reply-to@example.com">
                </div>
            </div>
            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="Subject-ul email-ului">
            <label for="body">Body</label>
            <textarea id="body" placeholder="Conținutul email-ului..."></textarea>
            <button onclick="runDetect()">🔍 Detect</button>
            <div class="loading" id="loading">⏳ Analiză în curs...</div>
            <pre id="output"></pre>
        </div>
    </div>
    <script>
        async function runDetect() {
            const subject = document.getElementById('subject').value.trim();
            const body = document.getElementById('body').value.trim();
            const from_addr = document.getElementById('from').value.trim();
            const reply_to = document.getElementById('reply_to').value.trim();
            const output = document.getElementById('output');
            const loading = document.getElementById('loading');
            if (!subject && !body) { alert('Te rog să introduci subject sau body.'); return; }
            output.classList.remove('show');
            loading.classList.add('show');
            try {
                const response = await fetch('/api/detect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject, body, from_addr, reply_to })
                });
                const data = await response.json();
                output.textContent = data.output || data.error || 'Fără rezultate.';
                if (data.error) output.classList.add('error');
                output.classList.add('show');
            } catch (err) {
                output.textContent = 'Eroare: ' + err.message;
                output.classList.add('show', 'error');
            } finally {
                loading.classList.remove('show');
            }
        }
    </script>
</body>
</html>
